dataset: chorus
adapter: chorus
paper_run: true
synthetic: false
source:
  backend: sql
  release_or_snapshot: UNCONFIRMED
  source_format: OMOP-compatible SQL
  mapping_confirmed: false
  database_url_env: CHORUS_DATABASE_URL
  schema_env: CHORUS_SCHEMA
  tables:
    patients: person
    encounters: visit_occurrence
    deaths: death
    diagnoses: condition_occurrence
    measurements: measurement
    medications: drug_exposure
    procedures: procedure_occurrence
    observations: observation
    bridge: event_visit_bridge
  columns:
    patients:
      patient_id: person_id
      birth_datetime: birth_datetime
      sex: sex
      race: race
      ethnicity: ethnicity
    encounters:
      visit_id: visit_occurrence_id
      patient_id: person_id
      start_datetime: visit_start_datetime
      end_datetime: visit_end_datetime
      visit_type: visit_type
      elective: elective
      followup_end_datetime: followup_end_datetime
    deaths:
      patient_id: person_id
      death_datetime: death_datetime
    diagnoses:
      diagnosis_id: condition_occurrence_id
      visit_id: visit_occurrence_id
      patient_id: person_id
      diagnosis_datetime: condition_start_datetime
      code: condition_source_value
      icd_version: icd_version
    measurements:
      event_id: measurement_id
      source_visit_id: visit_occurrence_id
      bridge_key: bridge_key
      patient_id: person_id
      event_datetime: measurement_datetime
      concept_key: measurement_concept_id
      concept_name: measurement_name
      value: value_as_number
      unit: unit_source_value
      semantics: record_semantics
    medications:
      event_id: drug_exposure_id
      source_visit_id: visit_occurrence_id
      bridge_key: bridge_key
      patient_id: person_id
      event_datetime: drug_exposure_start_datetime
      concept_key: drug_concept_id
      concept_name: drug_name
      value: quantity
      unit: dose_unit_source_value
      semantics: record_semantics
    procedures:
      event_id: procedure_occurrence_id
      source_visit_id: visit_occurrence_id
      bridge_key: bridge_key
      patient_id: person_id
      event_datetime: procedure_datetime
      concept_key: procedure_concept_id
      concept_name: procedure_name
      value: quantity
      unit: unit_source_value
      semantics: record_semantics
    bridge:
      bridge_key: bridge_key
      visit_id: visit_occurrence_id
  source_semantics:
    medications:
      drug_exposure: mixed_explicit_per_row
    procedures:
      procedure_occurrence: mixed_explicit_per_row
  observation_mode: audit_only
paper:
  analysis_role: primary_development
  exact_release_required: true
  methodological_override_top21_confirmed: false
  mapping_rules_confirmed: false
  measurement_unit_rules_approved: false
  charlson_algorithm: quan-2005-charlson-icd9cm-icd10cm-v1
  charlson_mapping_version: quan-2005-charlson-icd9cm-icd10cm-v1
  expected_counts: {visits: 22098, patients: 5892, deaths: 1004}
  expected_event_counts: UNCONFIRMED
  expected_resolved_config_hash: UNCONFIRMED
  mapping_file_hashes:
    chorus_mapping_template.csv: 5cd772ea699f26acb72ded63513c1155f714e651223926a91842a9f87e331442
    charlson_mapping.csv: 8fd72969d9804ab85334d875045e5df8ea25743d0e7140ad15499f7e752ea4fc
  release_clearance:
    classification: internal_restricted
    approved: false
    small_cell_threshold: UNCONFIRMED
  manuscript_reconciled: false
frozen_design:
  predictor_window_hours: 24
  landmark_hours: 24
  outcome_horizon_days: 30
  adult_min_age_years: 18
  prior_charlson_lookback_days: 365
  deduplication: stable_source_event_key_then_hard_fail_duplicates
