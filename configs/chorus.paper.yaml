  top_concepts_per_domain: 50
  retained_derived_features_per_domain: 21
  derived_feature_ranking: training_visit_occurrence_or_availability
  matrices: 8
  models: [logistic_regression, random_forest, gradient_boosting, lightgbm]
overrides:
  cohort:
    expected_counts: {visits: 22098, patients: 5892, deaths: 1004}
  outputs:
    public_root: outputs/paper
    restricted_root: restricted_outputs/paper
