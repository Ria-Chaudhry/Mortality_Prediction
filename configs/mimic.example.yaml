dataset: mimiciv
adapter: mimiciv
source:
  layout: native
  root: synthetic_data/mimic_like
  release_or_snapshot: synthetic-native-mimic-v2
  mapping_confirmed: true
  file_format: auto
  csv_chunksize: 500
  deterministic_subsample:
    enabled: false
    method: seeded_sha256_visit_rank
    max_visits: 23000
    seed: 42
  tables:
    patients: patients
    encounters: admissions
    diagnoses: diagnoses_icd
    labevents: labevents
    medications: prescriptions
    procedures: procedures_icd
  native:
    measurement_sources: [labevents]
    medication_concept_field: formulary_drug_cd
    medication_semantics: prescription
    procedure_semantics: coded
    race_harmonization:
      mode: identity
    ethnicity_harmonization:
      mode: unavailable
    admission_type_harmonization:
      EMERGENCY: inpatient
      OBSERVATION ADMIT: observation
      OUTPATIENT: outpatient
      ELECTIVE: inpatient
    elective_admission_types: [ELECTIVE]
    followup_policy: assume_complete_death_capture
paper_run: false
synthetic: true
overrides:
  features:
    medications:
      qualifying_semantics: [administration, prescription, order]
    procedures:
      qualifying_semantics: [performed, coded, claim, order]
  evaluation:
    bootstrap:
      repetitions: 80
