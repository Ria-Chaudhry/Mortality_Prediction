models:
  seed: 42
  threads: 1
  shap:
    enabled: true
    method_identifier: recovered_mimic_permutation_shap_v1
    explainer: permutation
    background_partition: outer_training_fold
    evaluation_partition: outer_validation_fold
    background_rows: 50
    evaluation_rows: 100
    seed: 42
    evaluation_seed_offset: 100
    minimum_max_evals: 101
    batch_size: 4
  frozen_order: [logistic_regression, random_forest, gradient_boosting, lightgbm]
  logistic_regression:
    max_iter: 1000
    random_state: 42
  random_forest:
    n_estimators: 300
    random_state: 42
    n_jobs: 1
  gradient_boosting:
    random_state: 42
  lightgbm:
    n_estimators: 500
    learning_rate: 0.03
    num_leaves: 31
    max_depth: -1
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: 1
    verbosity: -1
matrices:
  baseline: []
  baseline_measurements: [measurements]
  baseline_medications: [medications]
  baseline_procedures: [procedures]
  baseline_measurements_medications: [measurements, medications]
  baseline_measurements_procedures: [measurements, procedures]
  baseline_medications_procedures: [medications, procedures]
  baseline_all_domains: [measurements, medications, procedures]
