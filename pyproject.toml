[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-domain-mortality-framework"
version = "0.1.0"
description = "Dataset-agnostic framework for clinical-domain mortality prediction comparisons."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Clinical Domain Mortality Framework Contributors"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "jsonschema>=4.19",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "seaborn>=0.13"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "black>=24.0",
  "mypy>=1.8",
  "mkdocs>=1.5",
  "mkdocs-material>=9.5"
]
shap = ["shap>=0.44"]
workflow = ["snakemake>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.black]
line-length = 100
target-version = ["py310"]
