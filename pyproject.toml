[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-domain-mortality-framework"
version = "1.0.0"
description = "Fold-safe CHoRUS and MIMIC-IV mortality-prediction pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "Ria Chaudhry"}]
dependencies = [
  "lightgbm==4.6.0",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==25.0.0",
  "PyYAML==6.0.3",
  "scikit-learn==1.6.1",
  "scipy==1.15.3",
  "SQLAlchemy==2.0.41",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.2",
]

[project.scripts]
clinical-domain-mortality = "clinical_domain_mortality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: complete synthetic pipeline tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["synthetic_data/chorus_like", "synthetic_data/mimic_like"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
