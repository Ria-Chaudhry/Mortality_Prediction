name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: make install
      - run: make lint
      - run: make test
      - run: make test-full
      - run: make synthetic-run
        if: always()
      - run: make verify
        if: always()
      - run: make paper-preflight-chorus
        if: always()
      - run: make paper-preflight-mimiciv
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: outputs/test-reports
          if-no-files-found: warn
