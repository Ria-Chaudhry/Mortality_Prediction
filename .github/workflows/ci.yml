name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: make install
      - run: make lint
      - run: make test
      - run: make test-full
      - run: make synthetic-run
      - run: make verify
